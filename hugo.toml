baseURL = "https://musclelove-777.github.io/goods-lab/"
languageCode = "ja"
defaultContentLanguage = "ja"
title = "大人のおもちゃ研究所 | アダルトグッズ厳選レビュー"
theme = "PaperMod"
[pagination]
  pagerSize = 50

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[services]
  [services.googleAnalytics]
    ID = "G-SMT300FCFW"

[sitemap]
  changefreq = "daily"
  priority = 0.7
  filename = "sitemap.xml"

[params]
googleAnalyticsID = "G-YV53HTHVY2"
  env = "production"
  canonicalURL = true
  description = "オナホ・バイブ・TENGA・ローション…アダルトグッズを専門家目線で毎日レビュー。価格比較・使用感レビュー付き"
  author = "大人のおもちゃ研究所"
  images = ["https://musclelove-777.github.io/goods-lab/favicon.svg"]
  keywords = ["オナホ おすすめ ランキング", "アダルトグッズ レビュー", "TENGA おすすめ", "バイブ 人気", "ローション おすすめ", "大人のおもちゃ 比較", "オナホール 口コミ", "アダルトグッズ 初心者"]
  defaultTheme = "dark"
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = false
  TocOpen = false
  comments = false

  [params.homeInfoParams]
    Title = "大人のおもちゃ研究所"
    Content = """
アダルトグッズを毎日厳選レビュー！使用感・価格・おすすめ度をわかりやすく紹介。Presented by MuscleLove

<div class="home-cat-chips" style="display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px;">
  <strong style="width:100%;font-size:0.95rem;margin-bottom:4px;">🔥 人気カテゴリから探す</strong>
  <a href="/goods-lab/categories/onahole/" style="padding:6px 14px;background:#e63946;color:#fff;text-decoration:none;border-radius:18px;font-size:0.85rem;font-weight:600;">オナホ</a>
  <a href="/goods-lab/categories/vibrator/" style="padding:6px 14px;background:#1f2937;color:#fff;text-decoration:none;border-radius:18px;font-size:0.85rem;">バイブ</a>
  <a href="/goods-lab/categories/tenga/" style="padding:6px 14px;background:#1f2937;color:#fff;text-decoration:none;border-radius:18px;font-size:0.85rem;">TENGA</a>
  <a href="/goods-lab/categories/lotion/" style="padding:6px 14px;background:#1f2937;color:#fff;text-decoration:none;border-radius:18px;font-size:0.85rem;">ローション</a>
  <a href="/goods-lab/categories/cosplaygoods/" style="padding:6px 14px;background:#1f2937;color:#fff;text-decoration:none;border-radius:18px;font-size:0.85rem;">コスプレ衣装</a>
  <a href="/goods-lab/categories/smgoods/" style="padding:6px 14px;background:#1f2937;color:#fff;text-decoration:none;border-radius:18px;font-size:0.85rem;">SMグッズ</a>
  <a href="/goods-lab/categories/couple/" style="padding:6px 14px;background:#1f2937;color:#fff;text-decoration:none;border-radius:18px;font-size:0.85rem;">カップル</a>
  <a href="/goods-lab/categories/newgoods/" style="padding:6px 14px;background:#1f2937;color:#fff;text-decoration:none;border-radius:18px;font-size:0.85rem;">新商品</a>
  <a href="/goods-lab/categories/ranking/" style="padding:6px 14px;background:#f59e0b;color:#000;text-decoration:none;border-radius:18px;font-size:0.85rem;font-weight:600;">🏆 ランキング</a>
</div>
"""

  [[params.socialIcons]]
    name = "x-twitter"
    url = "https://x.com/MuscleGirlLove7"

  [[params.socialIcons]]
    name = "linktree"
    url = "https://linktr.ee/ILoveMyCats"

[params.assets]
  favicon = "favicon.svg"
  favicon16x16 = "favicon.svg"
  favicon32x32 = "favicon.svg"
  apple_touch_icon = "favicon.svg"
  safari_pinned_tab = "favicon.svg"

[params.cover]
  hidden = false
  hiddenInList = false
  hiddenInSingle = false
  linkFullImages = true

[params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  location = 0
  distance = 1000
  threshold = 0.4
  minMatchCharLength = 0
  keys = ["title", "permalink", "summary", "content"]

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

